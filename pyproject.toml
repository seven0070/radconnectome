[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radconnectome"
version = "0.1.0"
description = "RadConnectome — the agent with a wiring diagram (harness-first, graph-native, verification-first)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
rcx = "rcx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rcx*"]
